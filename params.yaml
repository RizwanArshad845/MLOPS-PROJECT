location:
  city: Lahore
  latitude: 31.5204
  longitude: 74.3587
  timezone: Asia/Karachi
  openaq_radius_m: 25000      # OpenAQ v3 max radius

data:
  start_date: "2023-01-01"
  end_date: "2024-12-31"
  weather_vars:
    - temperature_2m
    - relative_humidity_2m
    - wind_speed_10m
    - wind_direction_10m
    - surface_pressure
    - precipitation

validation:
  max_null_frac: 0.10          # per column, raw data
  max_stuck_hours: 24          # same PM2.5 value N hours in a row = stuck sensor
  ranges:
    pm25: [0, 1000]
    temperature_2m: [-5, 55]
    relative_humidity_2m: [0, 100]
    wind_speed_10m: [0, 150]
    wind_direction_10m: [0, 360]
    surface_pressure: [900, 1100]
    precipitation: [0, 300]

features:
  max_interp_gap_hours: 6
  lags: [1, 2, 3, 6, 12, 24, 48]
  rolling_windows: [6, 24]
  horizons: [24, 48]

split:
  train_end: "2024-06-30 23:00"
  val_end: "2024-09-30 23:00"   # test = Oct-Dec 2024 (smog season)

ridge:
  alpha: 1.0

xgboost:
  n_estimators: 600
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  early_stopping_rounds: 50

lightgbm:
  n_estimators: 600
  num_leaves: 31
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  early_stopping_rounds: 50

patchtst:
  context_length: 168
  prediction_length: 48
  patch_length: 16
  patch_stride: 8
  d_model: 64
  num_attention_heads: 4
  num_hidden_layers: 2
  ffn_dim: 128
  dropout: 0.1
  batch_size: 64
  epochs: 10
  learning_rate: 0.001
  train_stride: 1
  seed: 42

registry:
  model_name: smogcast-patchtst
  stage: Staging
